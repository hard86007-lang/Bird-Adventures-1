
name: Build Birds Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract game files
        run: |
          unzip -o Birds-Around-the-World-Android-Build.zip -d source
          cp -a source/. .

      - name: Install dependencies
        run: npm install

      - name: Prepare game
        run: |
          mkdir -p www
          cp index.html auth.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png www/

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Birds-Game-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
